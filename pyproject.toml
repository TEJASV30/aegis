[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fraud-risk-platform"
version = "0.1.0"
description = "Open-source real-time fraud and risk decisioning platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
  "evidently==0.4.40",
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "lightgbm>=4.5,<5",
  "mlflow>=2.17,<3",
  "numpy>=1.26,<3",
  "pandas>=2.1.2,<3",
  "prometheus-client>=0.21,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "psycopg2-binary>=2.9,<3",
  "pyarrow>=17,<20",
  "pydantic-settings>=2.6,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "shap>=0.46,<1",
  "uvicorn[standard]>=0.32,<1",
  "xgboost>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.7,<1",
]
airflow = ["apache-airflow==2.10.3"]

[project.scripts]
fraud-generate = "fraud_platform.data.generate_synthetic:main"
fraud-features = "fraud_platform.features.build_features:main"
fraud-feature-parity = "fraud_platform.features.parity:main"
fraud-validate-data = "fraud_platform.data.validate:main"
fraud-train = "fraud_platform.models.train:main"
fraud-promote = "fraud_platform.models.promote:main"
fraud-validate-release = "fraud_platform.models.validate_release:main"
fraud-drift = "fraud_platform.monitoring.drift:main"
fraud-performance = "fraud_platform.monitoring.performance:main"
fraud-external-benchmark = "fraud_platform.evaluation.external_benchmark:main"
fraud-load-report = "fraud_platform.evaluation.load_report:main"
fraud-model-reports = "fraud_platform.evaluation.model_reports:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_platform"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL or a composed service"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = [
  "E501",  # Long report copy and SQL are clearer unwrapped; formatting stays enforced.
  "N818",  # Domain exception name is part of the public idempotency contract.
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["airflow/dags"]
